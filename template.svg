  <rect x="800" y="740" width="350" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="820" y="775" font-family="monospace" font-size="16" font-weight="bold" fill="#89b4fa">Stock Flow</text>
  <text x="820" y="805" font-family="sans-serif" font-size="13" fill="#a6adc8">Inventory &amp; stock management</text>
  <text x="820" y="825" font-family="sans-serif" font-size="13" fill="#a6adc8">system with real-time updates</text>
  <circle cx="825" cy="855" r="5" fill="#3178c6"/>
  <text x="840" y="860" font-family="sans-serif" font-size="12" fill="#cdd6f4">TypeScript</text>

  <!-- বামপাশের উইন্ডোর প্রোফাইল ডিটেইলস (Avatar & Info) -->
  
  <!-- Profile Image (এখানে ডিফল্ট হিসেবে একটি মেইল রোবট অবতার দেওয়া হলো) -->
  <clipPath id="circle-clip">
    <circle cx="300" cy="220" r="90" />
  </clipPath>
  <!-- আপনি চাইলে href-এর ভেতরের লিংক পরিবর্তন করে আপনার নিজের ছবির ডিরেক্ট লিংক দিতে পারেন -->
  <image x="210" y="130" width="180" height="180" href="https://robohash.org/sazzad?set=set1" clip-path="url(#circle-clip)" />
  <!-- ছবির চারপাশের বর্ডার -->
  <circle cx="300" cy="220" r="95" fill="none" stroke="#f5c2e7" stroke-width="3"/>
  
  <!-- Name & Username -->
  <text x="300" y="355" font-family="sans-serif" font-size="28" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Sazzad Hossen</text>
  <text x="300" y="385" font-family="monospace" font-size="16" fill="#a6adc8" text-anchor="middle">@sazzad731</text>
  
  <!-- Contact Info -->
  <text x="40" y="440" font-family="monospace" font-size="15" fill="#f38ba8">📍 Dhaka, Bangladesh</text>
  <text x="40" y="475" font-family="monospace" font-size="15" fill="#a6e3a1">✉️ sazzad731@gmail.com</text>
  <text x="40" y="510" font-family="monospace" font-size="15" fill="#89b4fa">🔗 https://sazzad.dev</text>
  
  <!-- About Me Section -->
  <text x="40" y="560" font-family="monospace" font-size="16" fill="#cdd6f4">&gt; cat about.me</text>
  <rect x="40" y="575" width="520" height="50" rx="4" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="50" y="605" font-family="sans-serif" font-size="14" fill="#a6adc8">Passionate about building scalable web applications</text>
