  <rect x="20" y="670" width="1160" height="300" rx="8" fill="#1e1e2e" fill-opacity="0.8" stroke="#89b4fa" stroke-width="2"/>
  
  <text x="40" y="710" font-family="monospace" font-size="18" fill="#cdd6f4">&gt; pinned projects</text>

