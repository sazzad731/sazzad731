  <rect x="420" y="740" width="350" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="440" y="775" font-family="monospace" font-size="16" font-weight="bold" fill="#89b4fa">HostelBites</text>
  <text x="440" y="805" font-family="sans-serif" font-size="13" fill="#a6adc8">Meal management platform</text>
  <text x="440" y="825" font-family="sans-serif" font-size="13" fill="#a6adc8">with Stripe integration</text>
  <circle cx="445" cy="855" r="5" fill="#f1e05a"/>
  <text x="460" y="860" font-family="sans-serif" font-size="12" fill="#cdd6f4">JavaScript</text>

