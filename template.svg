  <text x="615" y="200" font-family="sans-serif" font-size="22" font-weight="bold" fill="#cdd6f4">I'm <tspan fill="#89b4fa">Sazzad Hossen</tspan></text>
  <text x="615" y="235" font-family="monospace" font-size="14" fill="#a6adc8">Full Stack Developer | MERN Specialist</text>

  <!-- টেক স্ট্যাক আইকন (আমরা শুধু placeholder টেক্সট দিচ্ছি, পরে আইকন অ্যাড করব) -->
  <text x="615" y="275" font-family="monospace" font-size="16" fill="#a6e3a1">&gt; tech stack</text>
  <!-- Placeholder icons -->
  <circle cx="635" cy="305" r="15" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1"/>
  <circle cx="675" cy="305" r="15" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1"/>
  <circle cx="715" cy="305" r="15" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1"/>
  <circle cx="755" cy="305" r="15" fill="#1e1e2e" stroke="#cdd6f4" stroke-width="1"/>


