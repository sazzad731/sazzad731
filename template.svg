  <rect x="600" y="50" width="580" height="300" rx="8" fill="#1e1e2e" fill-opacity="0.8" stroke="#f5c2e7" stroke-width="2"/>
  
  <text x="615" y="125" font-family="monospace" font-size="18" fill="#cdd6f4">&gt; cat README.md</text>
