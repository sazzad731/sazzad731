  <rect x="600" y="370" width="580" height="180" rx="8" fill="#1e1e2e" fill-opacity="0.8" stroke="#a6e3a1" stroke-width="2"/>
  
  <text x="615" y="445" font-family="monospace" font-size="18" fill="#cdd6f4">&gt; github stats</text>
  <text x="615" y="480" font-family="monospace" font-size="14" fill="#a6e3a1">Total Commits: {{COMMITS}}</text>
