  <rect x="40" y="740" width="350" height="110" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="60" y="775" font-family="monospace" font-size="16" font-weight="bold" fill="#89b4fa">FoodHub</text>
  <text x="60" y="805" font-family="sans-serif" font-size="13" fill="#a6adc8">Full-featured meal ordering</text>
