  <text x="615" y="540" font-family="monospace" font-size="14" fill="#cdd6f4">Contributions: 92%</text>
  <rect x="760" y="530" width="300" height="12" rx="6" fill="#313244"/>
  <rect x="760" y="530" width="276" height="12" rx="6" fill="#a6e3a1"/>

